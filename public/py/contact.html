<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe</title>
    <link rel="stylesheet" href="bootstrap.min.css">
    <link rel="stylesheet" href="global.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light border-bottom py-3 px-5">
        <a class="navbar-brand font-weight-bold" href="#">Vision Vibe</a>

        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav2">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav2">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
                <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
                <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
            </ul>
        </div>
    </nav>

    <main>
        <section class="py-5">
            <div class="container" style="max-width: 600px;">
                <h2 class="font-weight-bold mb-4 text-center">Contact Us</h2>

                <form>
                    <div class="form-group">
                        <label>Your Name</label>
                        <input type="text" class="form-control" placeholder="Enter your name">
                    </div>

                    <div class="form-group">
                        <label>Your Email</label>
                        <input type="email" class="form-control" placeholder="Enter your email">
                    </div>
                    <div class="form-group">
                        <label>Reason for Contact</label>
                        <select class="form-control">
                            <option selected disabled>Select an option</option>
                            <option>General Inquiry</option>
                            <option>Booking Request</option>
                            <option>Feedback</option>
                            <option>Collaboration</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Message</label>
                        <textarea class="form-control" rows="4" placeholder="Write your message"></textarea>
                    </div>

                    <button class="btn btn-primary btn-block mt-3" type="submit">Send Message</button>
                </form>
            </div>
        </section>
        <section class="py-5">
            <div class="container text-center">
                <h2 class="font-weight-bold mb-5">Contact Information</h2>
                <p class="text-muted mb-md-0"><span class="font-weight-bold">AT.</span> Vision vibe, Empire mall bardoli
                </p>
                <p class="text-muted"><span class="font-weight-bold">ON.</span> visisonvibe#@primi.com</p>
            </div>
        </section>
    </main>

    <footer class="border-top py-3 px-5">
        <div class="d-flex justify-content-between align-items-center">
            <span class="font-weight-bold">Vision Vibe</span>
            <span class="text-muted">© 2025 Vision Vibe. All rights reserved.</span>
        </div>
    </footer>

</body>

</html>
